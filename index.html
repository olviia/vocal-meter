<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vocal Meter</title>
  <meta name="description" content="Loudness and resonance meter for singing practice.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Vocal Meter</h1>
    <div class="top-right"><button id="install" class="ghost small" hidden>Install app</button><span id="chip-slot"></span></div>
  </header>
  <main id="main"></main>
  <div id="toast" role="status" hidden></div>
  <noscript>Vocal Meter needs JavaScript.</noscript>
  <script>
    // Right after an update the hosting cache can briefly serve a mix of old and new files.
    // If the app hasn't appeared after a few seconds, reload once to pick up a consistent set.
    setTimeout(function () {
      if (document.getElementById('main').children.length) return;
      try { if (sessionStorage.getItem('vm-reloaded')) return; sessionStorage.setItem('vm-reloaded', '1'); } catch (e) {}
      location.reload();
    }, 4000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
